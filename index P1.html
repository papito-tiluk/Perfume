<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grand Prix of Scent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%81%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,600;1,500&family=Hanken+Grotesk:wght@400;600&display=swap">
<style>
:root{--bg:#f2eef5;--card:#fbf9fd;--ink:#20152b;--muted:#6d6178;--line:#d9cfe2;--accent:#8c2f5b;--onaccent:#fff;--gold:#a67c1f;--red:#d7263d;--off:#d9cfe2;--good:#2c7a4b;--bad:#b3362f;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f1c;--card:#1e1627;--ink:#f3ecf7;--muted:#a99bb6;--line:#33283f;--accent:#e07aa6;--onaccent:#1a0f16;--gold:#d8b45c;--red:#ff4d5e;--off:#33283f;--good:#6fcf97;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150f1c;--card:#1e1627;--ink:#f3ecf7;--muted:#a99bb6;--line:#33283f;--accent:#e07aa6;--onaccent:#1a0f16;--gold:#d8b45c;--red:#ff4d5e;--off:#33283f;--good:#6fcf97;--bad:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;line-height:1.5}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
main{max-width:30rem;margin:0 auto;padding:1.25rem 1rem 3rem}
h1{font-family:"Bodoni Moda",Georgia,serif;font-weight:600;font-size:2rem;line-height:1.1;margin:.5rem 0 .6rem}
.flag{height:16px;border-radius:3px;margin-bottom:.9rem;background:repeating-conic-gradient(var(--ink) 0 25%,var(--card) 0 50%) 0 0/16px 16px;border:1px solid var(--line)}
.sub{color:var(--muted);margin:0 0 1.1rem}
.bar{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:.75rem}
.stage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem}
.lights{display:flex;gap:.6rem;margin-bottom:.7rem}
.lights i{width:2.1rem;height:2.1rem;border-radius:50%;background:var(--off);transition:background .4s}
.lights i.on{background:var(--red);box-shadow:0 0 12px var(--red)}
.pts{font-family:"Bodoni Moda",Georgia,serif;font-style:italic;font-size:1.5rem;margin:0}
.pts small{display:block;font-family:"Hanken Grotesk",system-ui,sans-serif;font-style:normal;font-size:.85rem;color:var(--muted)}
ol{list-style:none;padding:0;margin:1rem 0}
li{padding:.65rem .9rem;border-left:3px solid var(--accent);background:var(--card);border-radius:0 10px 10px 0;margin-bottom:.5rem}
li.locked{border-left-color:var(--line);color:var(--muted);font-style:italic}
li b{display:block;font-size:.85rem;color:var(--muted);font-weight:600}
input{width:100%;font:inherit;padding:.8rem .9rem;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.row{display:flex;gap:.5rem;margin-top:.6rem;flex-wrap:wrap}
button{font:inherit;font-weight:600;min-height:46px;padding:.6rem 1.1rem;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
button.main{background:var(--accent);color:var(--onaccent);flex:1}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#msg{min-height:1.6rem;margin:.75rem 0 0;font-weight:600}
.bad{color:var(--bad)}
.res{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 0;border-bottom:1px solid var(--line)}
.big{font-family:"Bodoni Moda",Georgia,serif;font-size:3rem;margin:.5rem 0 0}
@media(prefers-reduced-motion:reduce){.lights i{transition:none}}
.pod{position:relative;border-radius:14px;overflow:hidden;padding:.8rem .8rem 0;margin-bottom:1rem;color:#fff}
.pod::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0,rgba(255,255,255,.55),transparent 65%)}
.pod>*{position:relative}
.gp{text-align:center;background:rgba(0,0,0,.6);border-radius:6px;padding:.3rem .5rem;font-weight:600;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}
.steps{display:flex;align-items:flex-end;justify-content:center;gap:3px;margin-top:.6rem}
.steps>div{flex:1;max-width:9rem;text-align:center}
.step{background:#2a2a31;border-top:3px solid rgba(255,255,255,.7);font-family:"Bodoni Moda",Georgia,serif;font-size:1.6rem;padding:.2rem 0}
.photo{display:block;margin:0 auto .35rem;height:11.5rem;max-width:100%;object-fit:contain;border-radius:8px;border:3px solid #fff;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.45)}
</style>
</head>

function podium(d){var P=PODIUM[d[1]]||["Grand Prix","#444","#777","#444"],ph=PHOTOS[d[1]];
 return '<div class="pod" style="background:linear-gradient(160deg,'+P[1]+' 0 34%,'+P[2]+' 34% 67%,'+P[3]+' 67%)"><div class="gp">'+esc(P[0])+'</div>'
 +'<div class="steps"><div><div class="step" style="height:3.2rem">2</div></div><div>'+(ph?'<img class="photo" alt="'+esc(d[0]+" "+d[1])+'" src="'+ph+'">':'')+'<div class="step" style="height:4.6rem">1</div></div><div><div class="step" style="height:2.4rem">3</div></div></div></div>'}
var ROUNDS = Math.min(10, DATA.length), LABELS = ["Scent family","Top notes","Heart notes","Base notes"], MAX = 4, app = document.getElementById("app");
var S;

function norm(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"")}
function lev(a,b){var m=[],i,j;for(i=0;i<=a.length;i++){m[i]=[i]}for(j=0;j<=b.length;j++){m[0][j]=j}
 for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function isMatch(guess,d){var g=norm(guess);if(g.length<2)return false;
 var t=[d[1],d[0]+d[1]].concat(d[8]).map(norm);
 return t.some(function(x){return g===x||lev(g,x)<=Math.floor(x.length/6)})}
function esc(s){var e=document.createElement("div");e.textContent=s;return e.innerHTML}
function hint(d,n){return [LABELS[n-1],d[n+3]]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

function start(){S={q:shuffle(DATA).slice(0,ROUNDS),i:0,h:1,score:0,log:[],done:false};render()}
function pts(){return MAX+1-S.h}
function lights(){var s="",n;for(n=1;n<=MAX;n++)s+='<i class="'+(n<=pts()?"on":"")+'"></i>';return '<div class="lights" role="img" aria-label="'+pts()+' of '+MAX+' points left">'+s+'</div>'}

function render(){
 if(S.done){return end()}
 var d=S.q[S.i],items="",n;
 for(n=1;n<=MAX;n++){
  if(n<=S.h){var hh=hint(d,n);items+='<li><b>'+hh[0]+'</b>'+esc(hh[1])+'</li>'}
  else items+='<li class="locked">'+LABELS[n-1]+' locked</li>'}
 app.innerHTML='<h1>Grand Prix of Scent</h1><div class="flag"></div>'
 +'<div class="bar"><span>Lap '+(S.i+1)+' of '+S.q.length+'</span><span>Points '+S.score+'</span></div>'
 +'<div class="stage">'+lights()+'<p class="pts">'+pts()+' point'+(pts()>1?"s":"")+'<small>if you name it now. Lights go out with every clue.</small></p></div>'
 +'<ol>'+items+'</ol>'
 +'<label for="g" class="sub">Your guess (the name is enough)</label><input id="g" autocomplete="off" autocapitalize="words" enterkeyhint="go">'
 +'<div class="row"><button class="main" id="go">Guess</button>'+(S.h<MAX?'<button id="nx">Next clue</button>':'')+'<button id="gu">Give up</button></div><p id="msg" aria-live="polite"></p>';
 var inp=document.getElementById("g");inp.focus();
 inp.onkeydown=function(e){if(e.key==="Enter")guess()};
 document.getElementById("go").onclick=guess;
 document.getElementById("gu").onclick=function(){reveal(false)};
 var nx=document.getElementById("nx");if(nx)nx.onclick=function(){S.h++;render()}}

function guess(){
 var v=document.getElementById("g").value,d=S.q[S.i];
 if(!v.trim())return;
 if(isMatch(v,d))return reveal(true);
 if(S.h<MAX){S.h++;render();var m=document.getElementById("msg");m.className="bad";m.textContent="Not quite. Here is the next clue.";document.getElementById("g").value=v}
 else reveal(false)}

function reveal(win){
 var d=S.q[S.i],p=win?pts():0;S.score+=p;S.log.push([d,p]);
 var last=S.i===S.q.length-1;
 app.innerHTML='<h1>'+(win?"Chequered flag!":"Into the pit lane")+'</h1><div class="flag"></div><p class="sub">'+(win?"+"+p+" point"+(p>1?"s":""):"No points this lap")+'</p>'
 +podium(d)+'<div class="stage"><p class="pts">'+esc(d[1])+'<small>'+esc(d[0])+'</small></p></div>'
 +'<div class="row"><button class="main" id="nx2">'+(last?"See my result":"Next lap")+'</button></div>';
 var b=document.getElementById("nx2");b.focus();
 b.onclick=function(){if(last){S.done=true}else{S.i++;S.h=1}render()}}

function end(){
 var max=S.q.length*MAX,r=S.score/max,best=0;
 var t=r>=.9?"Pole position and fastest lap":r>=.7?"Race winner":r>=.5?"Podium finish":r>=.3?"Points finish":"Back to the pit lane";
 try{best=+localStorage.getItem("perfume-best")||0;if(S.score>best){best=S.score;localStorage.setItem("perfume-best",best)}}catch(e){}
 var rows=S.log.map(function(x){return '<div class="res"><span>'+esc(x[0][1])+' <span class="sub">'+esc(x[0][0])+'</span></span><b>'+x[1]+'/'+MAX+'</b></div>'}).join("");
 app.innerHTML='<h1>'+t+'</h1><div class="flag"></div><p class="big">'+S.score+' / '+max+'</p><p class="sub">Best on this device: '+best+'</p>'+rows
 +'<div class="row"><button class="main" id="again">Race again</button></div>';
 document.getElementById("again").onclick=start}

start();
</script>
